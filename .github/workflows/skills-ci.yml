name: skills-ci

on:
  push:
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jalankan pemeriksa ci/
        run: node ci/run-all.mjs
